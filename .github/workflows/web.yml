name: Web E2E Tests

on:
  workflow_run:
    workflows: ["Publish Web Demo to GitHub Pages"]
    types:
      - completed
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  web-e2e-tests:
    name: Run Web E2E Tests on Deployed Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for report preparation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute Target Base URL (Deployed Site vs Local Server)
        id: target_url
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="${{ github.event.workflow_run.repository.name }}"
          fi
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          DEPLOYED_APP_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/app/"
          echo "Checking live deployed website: $DEPLOYED_APP_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$DEPLOYED_APP_URL" || true)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Live deployed website is reachable ($DEPLOYED_APP_URL)."
            echo "base_url=$DEPLOYED_APP_URL" >> "$GITHUB_OUTPUT"
            echo "use_deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ Deployed website not directly reachable (HTTP $HTTP_STATUS), using local server fallback."
            echo "base_url=http://localhost:3000" >> "$GITHUB_OUTPUT"
            echo "use_deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Playwright E2E Tests in Docker
        timeout-minutes: 4
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.target_url.outputs.base_url }}
        run: ./docker/manage.sh e2e web --timeout=60000

      - name: Collect Docker test outputs
        if: always()
        run: |
          mkdir -p test-results playwright-report
          cp -a docker/artifacts/test-results/. test-results/ 2>/dev/null || true
          cp -a docker/artifacts/playwright-report/. playwright-report/ 2>/dev/null || true

      - name: Prepare Video & Step Screenshot Assets
        if: always()
        run: node scripts/prepare-report.mjs

      - name: Deploy Web Test Outputs to GitHub Pages (gh-pages)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')) && !cancelled()
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports
          publish_branch: gh-pages
          keep_files: true

      - name: Upload Playwright Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Pages Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-e2e-report
          path: cypress/reports/
          retention-days: 14
