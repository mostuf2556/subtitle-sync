name: Report Integrity Verification

on:
  workflow_run:
    workflows: ["Publish Web Demo to GitHub Pages", "Web E2E Tests"]
    types:
      - completed
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: report-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-integrity:
    name: Verify Report and Presentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package registry URLs
        run: sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        run: npm run build

      - name: Prepare Report Assets
        run: node scripts/prepare-report.mjs

      - name: Run Integrity Verification
        run: npm run test:report:integrity
