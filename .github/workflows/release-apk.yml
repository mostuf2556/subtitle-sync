name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0). Leave blank to auto-generate from run number'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Build Web Application
        timeout-minutes: 3
        run: |
          npm run build

      - name: Upload Web Build Artifacts (web-dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 14

      - name: Bundle Web Assets into Android Project
        run: |
          mkdir -p android-shell/app/src/main/assets
          cp -r dist/* android-shell/app/src/main/assets/
          echo "Web assets successfully bundled into Android assets directory."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: android-shell
          cache-read-only: false

      - name: Configure Android Environment & SDK
        timeout-minutes: 3
        run: |
          chmod +x android-shell/gradlew
          if [ ! -f "android-shell/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing; downloading wrapper jar..."
            mkdir -p android-shell/gradle/wrapper
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o android-shell/gradle/wrapper/gradle-wrapper.jar
          fi
          echo "sdk.dir=$ANDROID_HOME" > android-shell/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # Main build target: Debug APK (always builds fast and without keystore/signing requirements)
      - name: Build Android Debug APK
        timeout-minutes: 3
        run: |
          cd android-shell
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

      - name: Package & Verify APK & OTA Artifacts
        run: |
          mkdir -p release-artifacts
          
          # Create web-dist.zip release artifact for OTA hot updates without APK reinstallation
          if [ -d "dist" ]; then
            echo "Packaging web build output into release-artifacts/web-dist.zip for OTA updates..."
            (cd dist && zip -r ../release-artifacts/web-dist.zip .) || python3 -c "import shutil; shutil.make_archive('release-artifacts/web-dist', 'zip', 'dist')" || true
          fi

          # Find and copy debug APK
          find android-shell/app/build/outputs/apk/debug -type f -name "*.apk" -exec cp {} release-artifacts/YouTube-Viewer-debug.apk \; 2>/dev/null || true
          
          # If debug APK was not in standard folder, find first available apk
          if [ ! -f "release-artifacts/YouTube-Viewer-debug.apk" ]; then
            first_apk=$(find android-shell/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
            if [ -n "$first_apk" ]; then
              cp "$first_apk" release-artifacts/YouTube-Viewer-debug.apk
            fi
          fi

          cd release-artifacts
          for item in *; do
            if [ -f "$item" ] && [[ "$item" != *.sha256 ]]; then
              sha256sum "$item" > "${item}.sha256"
            fi
          done
          
          echo "=== COMPILED APK & OTA RELEASE ARTIFACTS ==="
          ls -lh
          echo "============================================"

      - name: Upload APKs & Release Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: youtube-viewer-apks
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Tag & Title
        id: release_info
        if: success()
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="YouTube Viewer ${TAG}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="YouTube Viewer ${TAG}"
          else
            TAG="v1.0.${{ github.run_number }}"
            TITLE="YouTube Viewer v1.0 (Build ${{ github.run_number }})"
          fi
          
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          echo "TITLE=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "Computed Tag: ${TAG}"
          echo "Computed Title: ${TITLE}"

      - name: Publish GitHub Release with Working APK & OTA Artifact
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        timeout-minutes: 3
        continue-on-error: true
        with:
          tag_name: ${{ steps.release_info.outputs.TAG }}
          name: ${{ steps.release_info.outputs.TITLE }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 YouTube Viewer Release (${{ steps.release_info.outputs.TAG }})

            ### 📦 Download Links
            - **⚡ [Download web-dist.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/web-dist.zip)** (OTA Release Artifact - Instant Hot Update in App, no APK reinstall required)
            - **📲 [Download YouTube-Viewer-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG }}/YouTube-Viewer-debug.apk)** (Full Android Native APK)
            - Automated install script available in repository: `update.apk.sh` (Bash)

            ---

            ### 🚀 Features Included in this Release:
            - **OTA Release Artifact Hot Update**: Instant web bundle update directly inside the app without package installation dialogs.
            - **Native Network Interceptor**: Directly intercepts YouTube caption HTTP streams (`youtube.com/api/timedtext`) using `WebViewClient` and native `OkHttp`.
            - **Offline & Standalone Ready**: Embeds the full modern web UI locally via `WebViewAssetLoader`.
            - **Universal YouTube URL Support**: Parses watch URLs, youtu.be shortlinks, Shorts, Live streams, embed codes, iframe tags, and custom timestamps.
            - **Signed & Verified**: Compatible with Android 7.0+ to Android 14 (API 24 to 35).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

