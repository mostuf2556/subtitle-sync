services:
  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    working_dir: /workspace
    environment:
      CI: "true"
      NODE_ENV: test
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-}
    volumes:
      - ./docker/artifacts/test-results:/workspace/test-results
      - ./docker/artifacts/playwright-report:/workspace/playwright-report
